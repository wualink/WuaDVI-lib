name=WuaDVI
version=0.1.0
author=Wualink <hello@wualabs.com>
maintainer=Wualink <hello@wualabs.com>
sentence=Driver library for the WuaDVI board: HDMI/DVI output, RP2354B display-engine management and resolution-independent LVGL widgets.
paragraph=Drives the WuaDVI PCB (ESP32-C3 application processor + RP2354B DVI display engine). Manages the RP2354B over SPI, streams the LVGL user interface to it as dirty rectangles, and provides widget primitives that adapt to every supported resolution, from 320x240 RGB565 to 1280x720 monochrome. Requires LVGL 9.x.
category=Display
