name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A library release is a promise about a version number, so this is the
      # one check worth failing the release over: the tag, library.json and
      # library.properties must all say the same thing.
      - name: Tag, library.json and library.properties agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          json=$(python -c "import json;print(json.load(open('library.json'))['version'])")
          props=$(grep -E '^version=' library.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag                : $tag"
          echo "library.json       : $json"
          echo "library.properties : $props"
          if [ "$tag" != "$json" ] || [ "$tag" != "$props" ]; then
            echo "::error::version mismatch — tag=$tag library.json=$json library.properties=$props"
            exit 1
          fi

  build:
    name: Build examples
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build HelloWuaDVI
        env:
          PLATFORMIO_CI_SRC: examples/HelloWuaDVI/HelloWuaDVI.ino
        run: |
          pio ci \
            --lib="." \
            --board=esp32-c3-devkitm-1 \
            --project-option="framework=arduino" \
            --project-option="build_flags=-DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A library is consumed as source: PlatformIO clones the tag and the
      # Arduino IDE installs a ZIP. GitHub generates the source archives for
      # the tag automatically, so the release itself carries the notes.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
