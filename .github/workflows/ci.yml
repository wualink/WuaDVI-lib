name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The clang-format PyPI wheel ships the binary; unpinned installs the
      # latest release, matching the style the repo is formatted with.
      - name: Install clang-format
        run: pip install clang-format

      - name: Check code formatting
        run: clang-format --dry-run --Werror src/*.h src/*.cpp

  build:
    name: Build examples (ESP32-C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('library.json') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # `pio ci` builds a sketch against this library, which is the only way a
      # library proves it actually compiles. It also exercises the library's own
      # extraScript, so a broken build hook fails here rather than in a user's
      # project.
      - name: Build HelloWuaDVI
        env:
          PLATFORMIO_CI_SRC: examples/HelloWuaDVI/HelloWuaDVI.ino
        run: |
          pio ci \
            --lib="." \
            --board=esp32-c3-devkitm-1 \
            --project-option="framework=arduino" \
            --project-option="build_flags=-DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DCORE_DEBUG_LEVEL=1"

  lint:
    name: Arduino library lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates library.properties, keywords.txt and the folder layout
      # against the Arduino library specification — the things that decide
      # whether this installs cleanly in the Arduino IDE.
      - uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update
          compliance: strict

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version lives in three places. They must agree, or an Arduino IDE
      # user and a PlatformIO user end up on different code with the same name.
      - name: library.json and library.properties agree
        run: |
          set -euo pipefail
          json=$(python -c "import json;print(json.load(open('library.json'))['version'])")
          props=$(grep -E '^version=' library.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "library.json       : $json"
          echo "library.properties : $props"
          if [ "$json" != "$props" ]; then
            echo "::error::version mismatch between library.json ($json) and library.properties ($props)"
            exit 1
          fi
